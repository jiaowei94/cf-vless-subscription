port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
unified-delay: true
dns:
  enable: true
  listen: 0.0.0.0:53
  default-nameserver:
  - 223.5.5.5
  - 114.114.114.114
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
proxies:
- name: 直连节点-自定义域名
  type: vless
  server: cf-vless-proxy.jiaoweixie94.workers.dev
  port: 443
  uuid: c32e9f81-5d41-4b19-9c17-48f657a82b92
  network: ws
  tls: true
  udp: true
  sni: cf-vless-proxy.jiaoweixie94.workers.dev
  skip-cert-verify: true
  client-fingerprint: chrome
  ws-opts:
    path: /
    headers:
      Host: cf-vless-proxy.jiaoweixie94.workers.dev
proxy-groups:
- name: Auto-Select
  type: select
  proxies:
  - 直连节点-自定义域名
rules:
- GEOIP,LAN,DIRECT
- GEOIP,CN,DIRECT
- MATCH,Auto-Select

port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
unified-delay: true
dns:
  enable: true
  listen: 0.0.0.0:53
  default-nameserver:
  - 223.5.5.5
  - 114.114.114.114
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
